<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Portfolio of Sumayya Mustafa, a Motion Graphics Animator based in Islamabad–Rawalpindi creating motion graphics, 3D animation, explainer videos, and visual storytelling experiences."
    />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect fill='%2316140F' width='100' height='100' rx='18'/%3E%3Ccircle cx='50' cy='50' r='26' fill='%23FF4D00'/%3E%3C/svg%3E" />
    <title>Sumayya Mustafa - Motion Graphics Animator</title>
    <script>
      /* apply saved theme before first paint — default is light */
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem("sm-theme") === "dark" ? "dark" : "light";
      } catch (e) {
        document.documentElement.dataset.theme = "light";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
